# ==============================================================================
# LINUX PLATFORM OVERRIDES
# ==============================================================================
# Loaded automatically via platform.conf symlink (created by install.sh)

# Linux keybinds
keybind = ctrl+shift+comma=reload_config
# Forward Ctrl+Enter to terminal applications (Ghostty binds it to fullscreen
# by default). Fullscreen is handled by the compositor with Super+F.
keybind = ctrl+enter=unbind
