set -g mouse on
set -g history-limit 10000
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",*:Tc"
set -sg escape-time 10
set-option -g focus-events on

# Allow OSC 52 clipboard forwarding, including over SSH.
set -g allow-passthrough on

# Ghostty starts tmux directly; login shells load platform PATH settings.
set-option -g default-shell "${SHELL}"

unbind C-b
set -g prefix C-a
bind C-a send-prefix

setw -g mode-keys vi

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind c
bind c new-window -c ~

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi Escape send -X cancel

# Copy through the native platform clipboard command.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel \
    'if command -v pbcopy >/dev/null 2>&1; then pbcopy; else wl-copy; fi'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel \
    'if command -v pbcopy >/dev/null 2>&1; then pbcopy; else wl-copy; fi'

bind r source-file ~/.tmux.conf \; display "Config reloaded!"

set -g status-style bg=black,fg=white
set -g status-left "[#S] "
set -g status-right "%H:%M %d-%b-%y"
set -g window-status-current-style bg=blue,fg=white,bold
